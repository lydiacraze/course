version: 2

models:

  # =====================================================
  # STG_CUSTOMER
  # =====================================================

  - name: stg_customer
    description: Staging table for customer master data

    columns:

      - name: customer_id
        description: Primary key of customer table
        tests:
          - unique
          - not_null

      - name: first_name
        description: Customer first name
        tests:
          - not_null

      - name: last_name
        description: Customer last name
        tests:
          - not_null

      - name: email_address
        description: Customer email address

  # =====================================================
  # STG_PRODUCT
  # =====================================================

  - name: stg_product
    description: Staging table for products

    columns:

      - name: product_id
        description: Primary key of product table
        tests:
          - unique
          - not_null

      - name: product_name
        description: Product name
        tests:
          - not_null

      - name: product_category_id
        description: Product category foreign key
        tests:
          - relationships:
              to: ref('stg_productcategory')
              field: product_category_id

      - name: standard_cost
        description: Product standard manufacturing cost
        tests:
          - not_null

      - name: list_price
        description: Product selling price
        tests:
          - not_null

  # =====================================================
  # STG_PRODUCTCATEGORY
  # =====================================================

  - name: stg_productcategory
    description: Product category hierarchy table

    columns:

      - name: product_category_id
        description: Primary key of category table
        tests:
          - unique
          - not_null

      - name: category_name
        description: Name of product category
        tests:
          - not_null

  # =====================================================
  # STG_SALESORDERHEADER
  # =====================================================

  - name: stg_salesorderheader
    description: Sales order header table

    columns:

      - name: sales_order_id
        description: Primary key of sales order header
        tests:
          - unique
          - not_null

      - name: customer_id
        description: Foreign key to customer table
        tests:
          - relationships:
              to: ref('stg_customer')
              field: customer_id

      - name: order_date
        description: Date customer placed order
        tests:
          - not_null

      - name: total_due
        description: Final order amount

  # =====================================================
  # STG_SALESORDERDETAIL
  # =====================================================

  - name: stg_salesorderdetail
    description: Sales order line items

    columns:

      - name: sales_order_detail_id
        description: Primary key of sales order detail
        tests:
          - unique
          - not_null

      - name: sales_order_id
        description: Foreign key to sales order header
        tests:
          - relationships:
              to: ref('stg_salesorderheader')
              field: sales_order_id

      - name: product_id
        description: Foreign key to product table
        tests:
          - relationships:
              to: ref('stg_product')
              field: product_id

      - name: order_qty
        description: Quantity ordered
        tests:
          - not_null

      - name: unit_price
        description: Selling price per product
        tests:
          - not_null

      - name: line_total
        description: Total amount for line item
        tests:
          - not_null